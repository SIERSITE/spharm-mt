# deploy/docker/proxy/spharmmt-tls.conf
#
# Vhosts públicos. Este ficheiro SÓ pode ser instalado depois de
# existirem /opt/spharmmt/proxy/certs/{fullchain,privkey}.pem — o nginx
# recusa arrancar se `ssl_certificate` apontar para um ficheiro que não
# existe, e como o proxy é o único caminho de entrada, isso deixaria a
# plataforma inacessível até alguém remover o ficheiro à mão.
#
# Instalar (só na fase 5 do plano):
#     sudo cp spharmmt-tls.conf /opt/spharmmt/proxy/conf/
#     sudo docker exec spharmmt-proxy nginx -t     # ANTES de aplicar
#     sudo /opt/spharmmt/scripts/update-platform.sh --no-build
#
# Remover (rollback): apagar o ficheiro e voltar a correr o update. A
# plataforma volta a HTTP pelo vhost de diagnóstico, que nunca sai.
#
# `upstream spharmmt_web` e o `map $forwarded_proto` vêm de
# spharmmt.conf. Não são redefinidos aqui: duplicá-los é erro de
# arranque do nginx.
#
# ── Separação entre domínios ─────────────────────────────────────────
# Não é convenção, é imposta:
#
#   admin.spharmmt.com   Wizard e API administrativa. A aplicação web e a
#                       ingestão devolvem 404.
#   app.spharmmt.com     aplicação web e Agents. /api/admin/* devolve 404.
#
# Assim, o token administrativo nunca é apresentado ao domínio por onde
# entram os Agents, e o endpoint de ingestão que vai dentro de cada
# agent.config.json não dá acesso à superfície administrativa. Uma
# configuração errada num dos lados falha depressa e alto (404) em vez de
# funcionar em silêncio pelo domínio errado.

# ═════════════════════════════════════════════════════════════════════
# :80 dos domínios públicos — ACME e redireccionamento
# ═════════════════════════════════════════════════════════════════════
#
# Só para estes dois nomes. Pedidos por IP ou por 127.0.0.1 continuam a
# cair no `default_server` de spharmmt.conf e a ser servidos em HTTP —
# é isso que mantém o túnel SSH a funcionar durante e depois da
# transição, incluindo se o TLS tiver de ser revertido.
server {
    listen 80;
    server_name admin.spharmmt.com app.spharmmt.com;

    # ANTES do redireccionamento: o Let's Encrypt valida em HTTP e não
    # segue redirecção para um certificado que ainda não existe (ou que
    # está a expirar). Com o 301 à frente disto, a renovação falha.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ═════════════════════════════════════════════════════════════════════
# admin.spharmmt.com — Wizard e API administrativa
# ═════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    http2 on;
    server_name admin.spharmmt.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Por omissão a aplicação nunca recebe X-Tenant-Slug do cliente.
    # Só as location da API dos Agents o preenchem, mais abaixo.
    set $spharmmt_tenant_slug "";

    include /etc/nginx/conf.d/spharmmt-proxy-common.inc;

    location = /healthz {
        access_log off;
        add_header content-type text/plain always;
        return 200 "ok\n";
    }

    # API administrativa. `^~` para ganhar às regex abaixo.
    location ^~ /api/admin/ {
        proxy_pass http://spharmmt_web;
        proxy_buffering on;
    }

    # Template base do agent: descarregado pelo WIZARD, não pelo agent.
    # Fica portanto do lado administrativo, e é o que permite ao Wizard
    # nunca depender de app.spharmmt.com.
    location ~ ^/agent-base/(?<agent_zip>[A-Za-z0-9._-]+\.zip)$ {
        alias /usr/share/nginx/agent-base/$agent_zip;
        # O nome do ficheiro é ESTÁVEL e o conteúdo muda a cada publicação
        # de revisão. Com max-age, um Wizard podia continuar a entregar a
        # revisão anterior durante uma hora depois de publicada a nova —
        # e ninguém veria o erro até o agent chegar à farmácia.
        #
        # `no-cache` não desliga a cache: obriga a revalidar. O nginx
        # responde 304 pelo ETag/Last-Modified enquanto o ZIP não mudar,
        # portanto não há custo de largura de banda, só correcção.
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    # Tudo o resto NÃO existe neste domínio: nem aplicação web, nem
    # login, nem ingestão. 404 e não 403 — não se confirma sequer que a
    # superfície existe noutro sítio.
    location / {
        return 404;
    }
}

# ═════════════════════════════════════════════════════════════════════
# app.spharmmt.com — aplicação web e Agents
# ═════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    http2 on;
    server_name app.spharmmt.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Por omissão a aplicação nunca recebe X-Tenant-Slug do cliente.
    # Só as location da API dos Agents o preenchem, mais abaixo.
    set $spharmmt_tenant_slug "";

    include /etc/nginx/conf.d/spharmmt-proxy-common.inc;

    location = /healthz {
        access_log off;
        add_header content-type text/plain always;
        return 200 "ok\n";
    }

    # A superfície administrativa não existe no domínio dos Agents.
    location ^~ /api/admin/ {
        return 404;
    }

    # Nem o template base do agent: quem o descarrega é o Wizard, pelo
    # domínio administrativo.
    location ^~ /agent-base/ {
        return 404;
    }

    location /_next/static/ {
        proxy_pass http://spharmmt_web;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # API dos Agents. Aqui — e só aqui — o X-Tenant-Slug do cliente passa
    # para a aplicação: é metade da credencial, e a outra metade (a ingest
    # key) é comparada por bcrypt contra o hash desse mesmo tenant. Sem a
    # chave certa, declarar um slug não dá acesso a nada.
    #
    # `set` e não `proxy_set_header`: um proxy_set_header aqui cancelaria
    # a herança de TODOS os do nível acima (ver o aviso no .inc), e o
    # pedido chegaria à aplicação sem Host nem X-Forwarded-*.
    location ^~ /api/ingest/ {
        set $spharmmt_tenant_slug $http_x_tenant_slug;
        proxy_pass http://spharmmt_web;
        proxy_buffering on;
    }

    location ^~ /api/outbox/ {
        set $spharmmt_tenant_slug $http_x_tenant_slug;
        proxy_pass http://spharmmt_web;
        proxy_buffering on;
    }

    # Aplicação web.
    location / {
        proxy_pass http://spharmmt_web;
        proxy_buffering on;
        # NÃO acrescentar `proxy_set_header` aqui — ver o aviso em
        # spharmmt-proxy-common.inc sobre o cancelamento da herança.
    }
}
