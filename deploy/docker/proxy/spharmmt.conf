# deploy/docker/proxy/spharmmt.conf
#
# Instalado em /opt/spharmmt/proxy/conf/spharmmt.conf e montado no nginx
# em /etc/nginx/conf.d/. Como o mount cobre a pasta inteira, o
# `default.conf` da imagem desaparece — este ficheiro é a configuração
# toda dos virtual hosts.
#
# Estado actual: HTTP apenas, para acesso por IP. O bloco HTTPS está
# escrito e comentado no fim; passar a TLS é descomentá-lo, pôr os
# certificados em /opt/spharmmt/proxy/certs e recarregar.

upstream spharmmt_web {
    # Nome do serviço na rede Docker. Sem `resolver`: o Docker resolve-o
    # no arranque do container e o endereço do serviço é estável.
    server web:3000;
    keepalive 32;
}

# Cabeçalho X-Forwarded-Proto correcto quer se venha de HTTP quer de
# HTTPS — quando o bloco TLS for activado, isto continua certo sem
# precisar de ser mudado.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80 default_server;
    server_name _;

    # ── Healthcheck do próprio proxy ─────────────────────────────────
    # Responde SEM tocar no upstream: é isto que distingue "o proxy está
    # de pé" de "a aplicação está de pé". Confundir os dois faz o
    # Docker reiniciar o proxy quando o problema é a aplicação.
    location = /healthz {
        access_log off;
        add_header content-type text/plain always;
        return 200 "ok\n";
    }

    # ── Limites ──────────────────────────────────────────────────────
    # 64 MB: o agent on-premise envia lotes de movimentos em JSON e os
    # maiores rondam as dezenas de MB. O default do nginx (1 MB) devolvia
    # 413 e o agent registava um erro que não apontava para o proxy.
    client_max_body_size 64m;
    client_body_timeout 120s;

    # Os jobs `/api/jobs/*` podem correr até 300s (ver maxDuration nos
    # handlers). Um proxy_read_timeout mais curto corta a ligação a meio
    # e deixa o SyncRun eternamente RUNNING.
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
    proxy_connect_timeout 10s;

    # ── Cabeçalhos ───────────────────────────────────────────────────
    proxy_http_version 1.1;
    # `$host` e não `$proxy_host`: a resolução de tenant por subdomínio
    # lê o Host original. Reescrevê-lo faria todos os pedidos resolverem
    # para o mesmo tenant — ou para nenhum.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # A aplicação nunca deve receber estes vindos de fora: são
    # calculados aqui, e aceitá-los do cliente deixaria qualquer um
    # escolher o seu próprio tenant.
    proxy_set_header X-Tenant-Slug   "";
    proxy_set_header X-Tenant-Source "";

    # ── Cabeçalhos de segurança ──────────────────────────────────────
    # `always` para que sejam enviados também nas respostas de erro.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # HSTS fica de fora enquanto o acesso for HTTP: anunciá-lo agora
    # trancaria o browser em HTTPS contra um servidor que ainda não o
    # tem, e a única saída seria limpar o estado HSTS à mão.

    # ── Compressão ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    # ── ZIP base do agent ────────────────────────────────────────────
    # Servido pelo próprio servidor, e não por object storage externo.
    # É isto que tira a Vercel Blob do caminho de instalação de uma
    # farmácia nova: o Admin Wizard pede o `agent-package` à API, recebe
    # um `baseAgentUrl` que aponta para aqui, e descarrega do mesmo host
    # onde já se autenticou.
    #
    # Sem segredos: o template base é código e um node.exe. A ingest key
    # entra no `agent.config.json` que o wizard injecta no ZIP depois de
    # o descarregar — nunca está neste ficheiro.
    #
    # Só ficheiros .zip, e só nomes simples. Sem isto, um ficheiro
    # deixado por engano na pasta (um .env, um dump) ficava na Internet.
    # A captura nomeada é o que permite o `alias` apontar ao ficheiro
    # exacto; o `..` não passa no conjunto de caracteres permitido.
    #
    # Uma location por REGEX é avaliada antes do prefixo `location /`,
    # portanto isto ganha sem precisar de `^~`. Tudo o resto sob
    # /agent-base/ cai no proxy para a aplicação, que devolve 404.
    location ~ ^/agent-base/(?<agent_zip>[A-Za-z0-9._-]+\.zip)$ {
        alias /usr/share/nginx/agent-base/$agent_zip;
        # O ZIP ronda os 30 MB e não muda entre publicações do mesmo
        # nome; uma hora de cache poupa o download repetido a quem
        # prepara vários pacotes seguidos.
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
    }

    # ── Estáticos do Next ────────────────────────────────────────────
    # Conteúdo com hash no nome: imutável, e o browser não precisa de
    # voltar a perguntar.
    location /_next/static/ {
        proxy_pass http://spharmmt_web;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ── Tudo o resto ─────────────────────────────────────────────────
    location / {
        proxy_pass http://spharmmt_web;
        proxy_buffering on;

        # ATENÇÃO, e não é intuitivo: em nginx, UM `proxy_set_header` num
        # `location` CANCELA a herança de TODOS os `proxy_set_header` do
        # nível acima. Este bloco tinha um `proxy_set_header
        # X-Accel-Buffering` e, com ele, perdia o `Host`, o
        # `X-Forwarded-*` e a limpeza dos cabeçalhos de tenant.
        #
        # O resultado: o nginx caía no default `Host: $proxy_host`, e a
        # aplicação recebia `Host: spharmmt_web` — o nome do bloco
        # `upstream`. Daí o "Invalid Server Actions request" (o Origin do
        # browser não batia com o Host) e, em silêncio, a resolução de
        # tenant por subdomínio a ler um host que não existe.
        #
        # Reproduzido: `location /` dava `host=spharmmt_web`, enquanto
        # `/_next/static/` — que não tem `proxy_set_header` próprio —
        # dava o host correcto.
        #
        # NÃO acrescentar `proxy_set_header` aqui sem repetir TODOS os do
        # bloco `server`. A linha que existia era, além do mais,
        # desnecessária: reencaminhava um cabeçalho vindo do CLIENTE, e o
        # que o nginx honra é o `X-Accel-Buffering` na RESPOSTA da
        # aplicação, coisa que faz sozinho.
    }
}

# ═════════════════════════════════════════════════════════════════════
# HTTPS — activar quando houver domínio e certificado
# ═════════════════════════════════════════════════════════════════════
#
# 1. Colocar fullchain.pem e privkey.pem em /opt/spharmmt/proxy/certs/
#    (0640 root:spharmmt; a chave privada NUNCA em modo legível a outros)
# 2. Descomentar o bloco abaixo e trocar app.exemplo.pt pelo domínio
# 3. Em platform.env:  PROXY_BIND=0.0.0.0  PROXY_HTTPS_PORT=443
#    e acrescentar o mapeamento 443 ao serviço proxy no compose
# 4. SESSION_COOKIE_SECURE=1 e PUBLIC_APP_URL=https://... em platform.env
#    (sem isto o cookie de sessão continua a ser emitido sem `secure`)
# 5. sudo ufw allow 443/tcp
# 6. Só DEPOIS de confirmar que o HTTPS serve: activar o redireccionamento
#    do 80 e considerar o HSTS
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name app.exemplo.pt *.app.exemplo.pt;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 1d;
#     ssl_stapling on;
#
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#     # ... repetir aqui os blocos `location` e `proxy_set_header` acima ...
# }
