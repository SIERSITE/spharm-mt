# deploy/docker/proxy/spharmmt.conf
#
# Instalado em /opt/spharmmt/proxy/conf/spharmmt.conf e montado no nginx
# em /etc/nginx/conf.d/. Como o mount cobre a pasta inteira, o
# `default.conf` da imagem desaparece — estes ficheiros são a
# configuração toda dos virtual hosts.
#
# Este ficheiro é o vhost de DIAGNÓSTICO: responde a qualquer Host que
# não seja um dos domínios públicos — o túnel SSH (127.0.0.1:8080) e o
# acesso por IP. Fica sempre disponível, e é por isso que continua a
# haver caminho de entrada mesmo que o TLS falhe.
#
# Os domínios públicos vivem em `spharmmt-tls.conf`, que só é instalado
# DEPOIS de os certificados existirem: o nginx recusa arrancar se
# `ssl_certificate` apontar para um ficheiro inexistente, e isso deixaria
# a stack sem proxy nenhum.

upstream spharmmt_web {
    # Nome do serviço na rede Docker. Sem `resolver`: o Docker resolve-o
    # no arranque do container e o endereço do serviço é estável.
    server web:3000;
    keepalive 32;
}

# Cabeçalho X-Forwarded-Proto correcto quer se venha de HTTP quer de
# HTTPS. Definido aqui uma vez; usado também por spharmmt-tls.conf.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80 default_server;
    server_name _;

    # Ver nota no .inc: por omissão a aplicação não recebe X-Tenant-Slug
    # do cliente; a API dos Agents é a excepção e preenche-o.
    set $spharmmt_tenant_slug "";

    include /etc/nginx/conf.d/spharmmt-proxy-common.inc;

    # ── Desafio ACME ─────────────────────────────────────────────────
    # Servido do disco, sem passar pela aplicação, e ANTES de qualquer
    # outra regra (`^~` trava a avaliação de regex). É por aqui que o
    # Let's Encrypt valida a posse do domínio, tanto na emissão inicial
    # como em cada renovação — se esta location deixar de funcionar, a
    # renovação falha e o certificado expira ao fim de 90 dias.
    #
    # O directório é o mesmo que o certbot recebe em `--webroot -w`.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        access_log off;
    }

    # ── Healthcheck do próprio proxy ─────────────────────────────────
    # Responde SEM tocar no upstream: é isto que distingue "o proxy está
    # de pé" de "a aplicação está de pé". Confundir os dois faz o
    # Docker reiniciar o proxy quando o problema é a aplicação.
    location = /healthz {
        access_log off;
        add_header content-type text/plain always;
        return 200 "ok\n";
    }

    # ── ZIP base do agent ────────────────────────────────────────────
    # Servido pelo próprio servidor, e não por object storage externo.
    # É isto que tira a Vercel Blob do caminho de instalação de uma
    # farmácia nova: o Admin Wizard pede o `agent-package` à API, recebe
    # um `baseAgentUrl` que aponta para aqui, e descarrega do mesmo host
    # onde já se autenticou.
    #
    # Sem segredos: o template base é código e um node.exe. A ingest key
    # entra no `agent.config.json` que o wizard injecta no ZIP depois de
    # o descarregar — nunca está neste ficheiro.
    #
    # Só ficheiros .zip, e só nomes simples. Sem isto, um ficheiro
    # deixado por engano na pasta (um .env, um dump) ficava exposto. A
    # captura nomeada é o que permite o `alias` apontar ao ficheiro
    # exacto; o `..` não passa no conjunto de caracteres permitido.
    location ~ ^/agent-base/(?<agent_zip>[A-Za-z0-9._-]+\.zip)$ {
        alias /usr/share/nginx/agent-base/$agent_zip;
        # Ver nota em spharmmt-tls.conf: nome estável + conteúdo mutável
        # exige revalidação, senão publica-se uma revisão e continua a
        # servir-se a anterior durante uma hora.
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    # ── Estáticos do Next ────────────────────────────────────────────
    # Conteúdo com hash no nome: imutável, e o browser não precisa de
    # voltar a perguntar.
    location /_next/static/ {
        proxy_pass http://spharmmt_web;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ── API dos Agents ───────────────────────────────────────────────
    # Aqui — e só aqui — o X-Tenant-Slug do cliente chega à aplicação: é
    # metade da credencial, e a outra metade (a ingest key) é comparada
    # por bcrypt contra o hash desse mesmo tenant. Declarar um slug sem a
    # chave certa não dá acesso a nada.
    #
    # `set` e não `proxy_set_header`: um proxy_set_header aqui cancelava a
    # herança de TODOS os do nível acima e o pedido chegava à aplicação
    # sem Host nem X-Forwarded-*.
    location ^~ /api/ingest/ {
        set $spharmmt_tenant_slug $http_x_tenant_slug;
        proxy_pass http://spharmmt_web;
        proxy_buffering on;
    }

    location ^~ /api/outbox/ {
        set $spharmmt_tenant_slug $http_x_tenant_slug;
        proxy_pass http://spharmmt_web;
        proxy_buffering on;
    }

    # As tres agregacoes que o agent dispara no fim do full-sync e do
    # daily-pipeline. Autenticam com a MESMA ingest key
    # (withIntegrationAuth), e sem esta linha o include entrega-as com
    # X-Tenant-Slug vazio: a chave chega, o tenant nao, e a resposta e
    # 401 missing_credentials.
    #
    # Este vhost nao separa dominios (serve tudo por IP/tunel), portanto
    # nao precisa de allowlist para se chegar la — precisa so do slug.
    location = /api/admin/pipeline/aggregate-month {
        set $spharmmt_tenant_slug $http_x_tenant_slug;
        proxy_pass http://spharmmt_web;
        proxy_buffering on;
    }

    location = /api/admin/pipeline/aggregate-compras {
        set $spharmmt_tenant_slug $http_x_tenant_slug;
        proxy_pass http://spharmmt_web;
        proxy_buffering on;
    }

    location = /api/admin/pipeline/aggregate-devolucoes {
        set $spharmmt_tenant_slug $http_x_tenant_slug;
        proxy_pass http://spharmmt_web;
        proxy_buffering on;
    }

    # O registo da corrida diária. Neste vhost chegava à aplicação mas
    # sem o slug, logo 401 missing_credentials — e o agent engole o erro
    # e termina OK, deixando `PipelineRun` vazio. É essa tabela que diz
    # que dias já correram.
    location = /api/admin/pipeline/record {
        set $spharmmt_tenant_slug $http_x_tenant_slug;
        proxy_pass http://spharmmt_web;
        proxy_buffering on;
    }

    # ── Tudo o resto ─────────────────────────────────────────────────
    location / {
        proxy_pass http://spharmmt_web;
        proxy_buffering on;
        # NÃO acrescentar `proxy_set_header` aqui — ver o aviso em
        # spharmmt-proxy-common.inc sobre o cancelamento da herança.
    }
}
