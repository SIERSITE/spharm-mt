name: Instalador macOS

# Constrói o `Instalador-SPharmMT-Silveira.pkg` num runner macOS da
# GitHub, para deixar de ser preciso ter um Mac à mão.
#
# O `pkgbuild`/`productbuild` só existem no macOS: isto não é uma
# preferência de runner, é a única opção.

on:
  # Execução manual — Actions → «Instalador macOS» → «Run workflow».
  workflow_dispatch:

  # E automaticamente quando algo do instalador muda. Um instalador que
  # só se constrói quando alguém se lembra de o construir passa meses
  # partido sem ninguém saber.
  push:
    paths:
      - "installer-macos/**"
      - ".github/workflows/macos-installer.yml"
  pull_request:
    paths:
      - "installer-macos/**"
      - ".github/workflows/macos-installer.yml"

# Só de leitura: este workflow não escreve no repositório, não publica
# releases e não toca em ambientes. Constrói e larga um artefacto.
permissions:
  contents: read

# Uma execução por ramo. Um push em cima de outro cancela a anterior em
# vez de esperar por um runner macOS, que é o recurso escasso.
concurrency:
  group: macos-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    name: Construir e verificar o .pkg
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Só é preciso a árvore actual. O histórico não entra em nada
          # do que este workflow faz.
          fetch-depth: 1

      # Nada a instalar, e vale a pena registar porquê em vez de deixar
      # a ausência de passos parecer um esquecimento:
      #
      #   · `sips`, `iconutil`, `pkgbuild`, `productbuild`, `plutil` e
      #     `python3` já vêm no runner macOS;
      #   · `npm run test:macos-installer` chama `bash …`, portanto não
      #     precisa de `npm ci` — não há dependências para instalar;
      #   · o lançador é um script de shell, logo não há toolchain de
      #     compilação nem arquitectura para escolher.
      - name: Registar o ambiente
        run: |
          echo "runner   : $(sw_vers -productName) $(sw_vers -productVersion) ($(uname -m))"
          echo "node     : $(node --version 2>/dev/null || echo 'ausente')"
          echo "npm      : $(npm --version 2>/dev/null || echo 'ausente')"
          echo "python3  : $(python3 --version 2>&1)"
          for f in sips iconutil pkgbuild productbuild plutil; do
            printf '%-12s : %s\n' "$f" "$(command -v "$f" || echo 'AUSENTE')"
          done

      # ── Assinatura ───────────────────────────────────────────────────
      #
      # Sem segredos configurados, o .pkg sai por assinar — que é o
      # caminho previsto e o único hoje testado. Com os três segredos
      # presentes, importa-se o certificado para um porta-chaves
      # temporário e assina-se.
      #
      # Guardado pelos TRÊS de uma vez de propósito: com a identidade mas
      # sem o certificado no porta-chaves, o `productbuild --sign` falha
      # o build inteiro. Meia configuração é pior do que nenhuma.
      #
      # Nada disto vive no repositório. Para activar, definir em
      # Settings → Secrets and variables → Actions:
      #   MACOS_CERT_P12       certificado Developer ID Installer, .p12 em base64
      #   MACOS_CERT_PASSWORD  password do .p12
      #   MACOS_SIGN_ID        "Developer ID Installer: Nome (TEAMID)"
      - name: Preparar assinatura (se houver certificado)
        id: assinatura
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ] || [ -z "${CERT_PASSWORD:-}" ] || [ -z "${SIGN_ID:-}" ]; then
            echo "sem certificado configurado — o .pkg sai por assinar"
            echo "assinar=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHAVEIRO="$RUNNER_TEMP/spharmmt-signing.keychain-db"
          SENHA="$(uuidgen)"
          security create-keychain -p "$SENHA" "$CHAVEIRO"
          security set-keychain-settings -lut 900 "$CHAVEIRO"
          security unlock-keychain -p "$SENHA" "$CHAVEIRO"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$CHAVEIRO" \
            -P "$CERT_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$SENHA" "$CHAVEIRO" >/dev/null
          security list-keychains -d user -s "$CHAVEIRO" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "certificado importado"
          echo "assinar=sim" >> "$GITHUB_OUTPUT"

      - name: Construir o instalador
        env:
          # Vazio quando não há segredo — e o script trata vazio como
          # «não assinar», que é o comportamento previsto.
          SPHARMMT_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
        run: bash installer-macos/build-macos-installer.sh

      # Depois do build, portanto a camada B do teste (bundle,
      # permissões, conteúdo do .pkg) corre a sério em vez de saltar.
      # O `set -e` implícito do runner faz o job falhar se o teste
      # devolver ≠ 0.
      - name: Verificar
        run: npm run test:macos-installer

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Instalador macOS"
            echo ""
            if [ -f dist-macos/Instalador-SPharmMT-Silveira.pkg ]; then
              echo "| | |"
              echo "|---|---|"
              echo "| PKG | \`$(du -h dist-macos/Instalador-SPharmMT-Silveira.pkg | cut -f1)\` |"
              echo "| URL | \`https://app.spharmmt.com/login?__tenant=silveira\` |"
              echo "| Assinatura | ${{ steps.assinatura.outputs.assinar == 'sim' && 'assinado' || 'por assinar' }} |"
              echo "| sha256 | \`$(shasum -a 256 dist-macos/Instalador-SPharmMT-Silveira.pkg | cut -d' ' -f1)\` |"
            else
              echo "O .pkg não chegou a ser produzido."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar o .pkg
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-SPharmMT-Silveira
          path: dist-macos/Instalador-SPharmMT-Silveira.pkg
          # Falhar aqui em vez de publicar um artefacto vazio: um
          # download que devolve um zip sem nada lá dentro é pior do que
          # um workflow vermelho.
          if-no-files-found: error
          retention-days: 30
